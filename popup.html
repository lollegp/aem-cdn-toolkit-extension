<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>AEM CDN Toolkit</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="popup">
    <main>
      <div class="eyebrow">AEM · CDN · ENVIRONMENTS</div>
      <h1>Page toolkit</h1>
      <p class="muted hint">Actions for the current tab</p>
      <div class="url" id="url">Loading…</div>
      <div class="grid">
        <div>
          <label for="environment">Environment</label
          ><select id="environment"></select>
        </div>
        <div>
          <label for="country">Country</label
          ><select id="country"></select>
        </div>
      </div>
      <p class="hint" id="match"></p>
      <p class="hint" id="forwardedHost"></p>
      <button id="bypass">Add random cache parameter</button
      ><button id="publish" class="secondary">Open AEM publish</button
      ><button id="purge" class="danger">Purge current page</button
      ><button id="purgeAll" class="danger">Purge entire environment</button>
      <p class="hint" id="bulkHint"></p>
      <section id="confirm" hidden>
        <p class="hint" id="purgeTarget"></p>
        <label class="check"
          ><input type="checkbox" id="confirmed" />I confirm this CDN purge
          request</label
        >
        <div id="bulkConfirm" hidden>
          <label for="confirmation">Type the confirmation shown above</label
          ><input id="confirmation" autocomplete="off" spellcheck="false" />
        </div>
        <button id="sendPurge" class="danger">Send PURGE request</button
        ><button id="cancelPurge" class="secondary">Cancel</button>
      </section>
      <div id="status" role="status" aria-live="polite"></div>
      <div class="activity" id="latest" role="status"></div>
      <button id="options" class="linkbutton">
        Settings and purge activity
      </button>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
