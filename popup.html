<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>AEM CDN Toolkit</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="popup">
    <main>
      <header class="brand">
        <img src="icons/toolkit-neutral-48.png" width="32" height="32" alt="" />
        <div>
          <span class="eyebrow">AEM CDN TOOLKIT</span>
          <h1>Page toolkit</h1>
        </div>
      </header>
      <p class="field-caption">CURRENT PAGE</p>
      <div class="url" id="url">Loading…</div>
      <div class="grid">
        <div>
          <label for="environment">Environment</label
          ><select id="environment"></select>
        </div>
        <div>
          <label for="country">Country</label
          ><select id="country"></select>
        </div>
      </div>
      <p class="hint match-status" id="match"></p>
      <p class="hint" id="forwardedHost"></p>
      <div class="page-actions">
        <button id="purge">Purge current page</button
        ><button id="publish" class="secondary">Open AEM publish</button
        ><button id="bypass" class="secondary">
          Add cache-busting parameter
        </button>
      </div>
      <div class="bulk-actions">
        <button id="purgeAll" class="danger-outline">
          Purge entire environment
        </button>
        <p class="hint" id="bulkHint"></p>
      </div>
      <section
        id="confirm"
        class="confirmation-card"
        aria-label="Review purge request"
        hidden
      >
        <h2>Review purge request</h2>
        <p class="hint" id="purgeTarget"></p>
        <label class="check"
          ><input type="checkbox" id="confirmed" />I confirm this CDN purge
          request</label
        >
        <div class="actions">
          <button id="sendPurge" class="danger">Send PURGE request</button
          ><button id="cancelPurge" class="secondary">Cancel</button>
        </div>
      </section>
      <div id="status" role="status" aria-live="polite"></div>
      <div class="activity" id="latest" role="status"></div>
      <footer class="popup-footer">
        <button id="options" class="linkbutton">Settings</button
        ><button id="activity" class="linkbutton">Purge activity</button>
      </footer>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
