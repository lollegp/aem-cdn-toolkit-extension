name: Publish help and privacy site

on:
  push:
    branches: [main]
    paths:
      - 'help.html'
      - 'privacy.html'
      - 'site.css'
      - 'icons/toolkit-neutral-48.png'
      - 'docs/imgs/**'
      - 'scripts/package.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-toolkit-to-personal-pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check deployment credential
        env:
          PAGES_DEPLOY_TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN }}
        run: |
          if [ -z "$PAGES_DEPLOY_TOKEN" ]; then
            echo "::error::Add PAGES_DEPLOY_TOKEN with Contents read/write access to lollegp/lollegp.github.io in this repository's Actions secrets."
            exit 1
          fi

      - name: Check out extension
        uses: actions/checkout@v4
        with:
          # Use the latest main so a manually rerun old job cannot publish stale pages.
          ref: main
          path: source
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build site
        working-directory: source
        run: |
          python3 scripts/package.py
          # Keep existing public help.html links working alongside the landing page.
          cp dist/site/index.html dist/site/help.html

      - name: Check out personal Pages repository
        uses: actions/checkout@v4
        with:
          repository: lollegp/lollegp.github.io
          ref: main
          path: destination
          token: ${{ secrets.PAGES_DEPLOY_TOKEN }}

      - name: Sync toolkit site
        run: |
          mkdir -p destination/aem-cdn-toolkit-extension
          rsync -a --delete source/dist/site/ destination/aem-cdn-toolkit-extension/

      - name: Commit and push site changes
        working-directory: destination
        run: |
          git add -- aem-cdn-toolkit-extension
          if git diff --cached --quiet; then
            echo "Site is already up to date."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          source_sha=$(git -C ../source rev-parse --short HEAD)
          git commit -m "docs: sync AEM CDN Toolkit site (${source_sha})"
          # A normal push rejects concurrent destination changes instead of overwriting them.
          git push origin HEAD:main
